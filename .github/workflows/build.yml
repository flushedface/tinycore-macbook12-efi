name: Build TinyCore EFI image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TC_VERSION: "17.1"
      TC_BASE: "http://tinycorelinux.net/17.x/x86_64/release"
      IMAGE_NAME: "tinycore-macbook-efi.img"
    steps:
      - uses: actions/checkout@v4

      - name: Install image and EFI build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dosfstools e2fsprogs gdisk grub-efi-amd64-bin mtools xorriso

      - name: Download official TinyCorePure64 ISO
        run: |
          mkdir -p build/root/EFI/BOOT build/root/EFI/tinycore
          curl --fail --location --retry 3 \
            "$TC_BASE/TinyCorePure64-${TC_VERSION}.iso" \
            --output build/tinycore.iso
          xorriso -osirrox on -indev build/tinycore.iso \
            -extract /boot/vmlinuz64 build/root/EFI/tinycore/vmlinuz64
          xorriso -osirrox on -indev build/tinycore.iso \
            -extract /boot/corepure64.gz build/root/EFI/tinycore/corepure64.gz

      - name: Build portable GRUB EFI loader
        run: |
          cat > build/embedded.cfg <<'EOF'
          search --file --set=root /EFI/BOOT/grub.cfg
          configfile ($root)/EFI/BOOT/grub.cfg
          EOF
          grub-mkstandalone --format=x86_64-efi \
            --output=build/root/EFI/BOOT/BOOTX64.EFI \
            "boot/grub/grub.cfg=build/embedded.cfg"
          cat > build/root/EFI/BOOT/grub.cfg <<'EOF'
          set default=0
          set timeout=3

          menuentry "TinyCorePure64 — MacBook EFI" {
              linux /EFI/tinycore/vmlinuz64 loglevel=3 waitusb=10 tce=LABEL=tce
              initrd /EFI/tinycore/corepure64.gz
          }
          EOF

      - name: Create GPT boot image
        run: |
          mkdir -p output
          truncate --size=768M "output/$IMAGE_NAME"
          sgdisk --clear \
            --new=1:2048:+256M --typecode=1:ef00 --change-name=1:EFI \
            --new=2:0:0 --typecode=2:8300 --change-name=2:tce \
            "output/$IMAGE_NAME"
          LOOP=$(sudo losetup --find --show --partscan "output/$IMAGE_NAME")
          trap 'sudo umount /mnt/tc-efi 2>/dev/null || true; sudo umount /mnt/tc-tce 2>/dev/null || true; sudo losetup -d "$LOOP" 2>/dev/null || true' EXIT
          sudo mkfs.vfat -F 32 -n EFI "${LOOP}p1"
          sudo mkfs.ext4 -F -L tce "${LOOP}p2"
          sudo mkdir -p /mnt/tc-efi /mnt/tc-tce
          sudo mount "${LOOP}p1" /mnt/tc-efi
          sudo mount "${LOOP}p2" /mnt/tc-tce
          # FAT32 cannot store Unix owner or mode metadata.
          sudo cp -r --no-preserve=mode,ownership build/root/EFI /mnt/tc-efi/
          sudo mkdir -p /mnt/tc-tce/tce/optional
          sudo umount /mnt/tc-efi /mnt/tc-tce
          sudo losetup -d "$LOOP"
          trap - EXIT
          gzip --keep --best "output/$IMAGE_NAME"
          sha256sum "output/$IMAGE_NAME.gz" > "output/$IMAGE_NAME.gz.sha256"

      - name: Upload EFI image
        uses: actions/upload-artifact@v4
        with:
          name: tinycore-macbook-efi
          path: |
            output/tinycore-macbook-efi.img.gz
            output/tinycore-macbook-efi.img.gz.sha256
          if-no-files-found: error
          retention-days: 30
